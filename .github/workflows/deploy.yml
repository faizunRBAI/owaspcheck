name: deploy
'on':
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Maven build
      run: mvn -B -ntp clean compile
  unit_tests:
    runs-on: ubuntu-latest
    needs:
    - build
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Unit tests
      run: mvn -B -ntp test
    - name: Upload surefire report
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-report
        path: target/surefire-reports
  integration_tests:
    runs-on: ubuntu-latest
    needs:
    - build
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Integration tests (Testcontainers PostgreSQL)
      run: mvn -B -ntp verify -Dsurefire.skip=true
    - name: Upload failsafe report
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-report
        path: target/failsafe-reports
  checkstyle:
    runs-on: ubuntu-latest
    needs:
    - build
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Checkstyle
      run: mvn -B -ntp checkstyle:check
  spotbugs:
    runs-on: ubuntu-latest
    needs:
    - build
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: SpotBugs
      run: mvn -B -ntp compile spotbugs:check
  dependency_check:
    runs-on: ubuntu-latest
    needs:
    - build
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: OWASP Dependency Check
      run: mvn -B -ntp dependency-check:check
    - name: Upload dependency-check report
      uses: actions/upload-artifact@v4
      with:
        name: owasp-dependency-check-report
        path: target/dependency-check-report.html
  docker_push:
    runs-on: ubuntu-latest
    needs:
    - unit_tests
    - integration_tests
    - checkstyle
    - spotbugs
    - dependency_check
    env:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}
      IMAGE_SHA: ghcr.io/${{ github.repository }}:${{ github.sha }}
      IMAGE_LATEST: ghcr.io/${{ github.repository }}:latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Package jar
      run: mvn -B -ntp clean package -DskipTests
    - name: Log in to GHCR
      run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
    - name: Build image
      run: docker build -t "$IMAGE_SHA" -t "$IMAGE_LATEST" .
    - name: Push image
      run: docker push "$IMAGE_SHA"
    - name: Push latest tag
      run: docker push "$IMAGE_LATEST"
  provision:
    runs-on: ubuntu-latest
    needs:
    - docker_push
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    timeout-minutes: 40
    outputs:
      instance_ip: ${{ steps.tf_out.outputs.instance_ip }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Terraform validate
      run: terraform validate
      working-directory: infra
    - name: Terraform apply
      run: terraform apply -auto-approve -input=false
      working-directory: infra
    - id: tf_out
      name: Export instance IP
      run: echo "instance_ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
      working-directory: infra
  puppet_bootstrap:
    runs-on: ubuntu-latest
    needs:
    - provision
    env:
      HOST: ${{ needs.provision.outputs.instance_ip }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        '
    - name: Wait for SSH
      run: "for i in $(seq 1 30); do\n  if ssh -o StrictHostKeyChecking=accept-new\
        \ -o ConnectTimeout=10 -i ~/.ssh/deploy_key \"$SSH_USER@$HOST\" 'echo ready';\
        \ then\n    exit 0\n  fi\n  echo \"SSH not ready yet (attempt $i), retrying\
        \ in 10s\"\n  sleep 10\ndone\necho \"SSH never became available\"\nexit 1\n"
    - name: Copy Puppet manifests
      run: scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key -r puppet
        "$SSH_USER@$HOST:/tmp/puppet"
    - name: Install Puppet agent
      run: ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key "$SSH_USER@$HOST"
        'sudo bash /tmp/puppet/install_puppet.sh'
    - name: Apply Puppet bootstrap manifest
      run: ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key "$SSH_USER@$HOST"
        'sudo /opt/puppetlabs/bin/puppet apply --detailed-exitcodes --modulepath=/tmp/puppet/modules
        /tmp/puppet/manifests/site.pp; rc=$?; if [ "$rc" -eq 0 ] || [ "$rc" -eq 2
        ]; then exit 0; fi; exit "$rc"'
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    - puppet_bootstrap
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      HOST: ${{ needs.provision.outputs.instance_ip }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.sha }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      APP_JWT_SECRET: ${{ secrets.JWT_SECRET }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Install Ansible
      run: 'python3 -m pip install --upgrade pip

        python3 -m pip install "ansible-core>=2.16"

        '
    - name: Read DB endpoint from terraform state
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\necho\
        \ \"DB_HOST=$(terraform output -raw db_address)\" >> \"$GITHUB_ENV\"\necho\
        \ \"DB_NAME=$(terraform output -raw db_name)\" >> \"$GITHUB_ENV\"\necho \"\
        DB_USER=$(terraform output -raw db_username)\" >> \"$GITHUB_ENV\"\n"
      working-directory: infra
    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

        '
    - name: Generate inventory
      run: 'printf ''[app]\n%s ansible_user=%s ansible_ssh_private_key_file=%s\n''
        "$HOST" "$SSH_USER" "$HOME/.ssh/deploy_key" > ansible/inventory.ini

        cat ansible/inventory.ini

        '
    - name: Run Ansible playbook
      run: "ansible-playbook -i ansible/inventory.ini ansible/site.yml \\\n  -e \"\
        image_ref=$IMAGE_REF\" \\\n  -e \"ghcr_user=$GHCR_USER\" \\\n  -e \"ghcr_token=$GHCR_TOKEN\"\
        \ \\\n  -e \"db_host=$DB_HOST\" \\\n  -e \"db_name=$DB_NAME\" \\\n  -e \"\
        db_user=$DB_USER\" \\\n  -e \"db_password=$APP_DB_PASSWORD\" \\\n  -e \"jwt_secret=$APP_JWT_SECRET\"\
        \n"
      env:
        ANSIBLE_HOST_KEY_CHECKING: 'False'
  verify:
    runs-on: ubuntu-latest
    needs:
    - provision
    - configure
    env:
      HOST: ${{ needs.provision.outputs.instance_ip }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Health check /actuator/health
      run: curl --fail --show-error --silent --retry 20 --retry-delay 15 --retry-all-errors
        "http://$HOST/actuator/health"
    - name: Assert HTTP 200
      run: 'code=$(curl -s -o /dev/null -w ''%{http_code}'' --retry 10 --retry-delay
        10 --retry-all-errors "http://$HOST/actuator/health")

        echo "health status=$code"

        test "$code" = "200"

        '
    - name: Verify OpenAPI document is served
      run: 'curl --fail --silent --retry 10 --retry-delay 10 --retry-all-errors "http://$HOST/v3/api-docs"
        > /dev/null

        echo "OpenAPI document reachable"

        '
  perf:
    runs-on: ubuntu-latest
    needs:
    - verify
    env:
      BASE_URL: http://${{ needs.provision.outputs.instance_ip }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Install k6
      run: 'curl -fsSL https://github.com/grafana/k6/releases/download/v0.49.0/k6-v0.49.0-linux-amd64.tar.gz
        -o /tmp/k6.tar.gz

        tar -xzf /tmp/k6.tar.gz -C /tmp

        sudo install /tmp/k6-v0.49.0-linux-amd64/k6 /usr/local/bin/k6

        k6 version

        '
    - name: Run k6 smoke performance test
      run: k6 run tests/performance/smoke.js
