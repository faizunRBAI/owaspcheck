spring:
  application:
    name: owaspcheck
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:idp}
    username: ${DB_USER:idp}
    password: ${DB_PASSWORD:idp}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

idp:
  jwt:
    secret: ${JWT_SECRET:ZGV2ZWxvcG1lbnRPbmx5U2VjcmV0S2V5Rm9yTG9jYWxUZXN0aW5nMTIzNDU2Nzg5MA}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    issuer: owaspcheck-idp

logging:
  level:
    root: INFO
    com.enterprise.idp: INFO
