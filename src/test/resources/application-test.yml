spring:
  datasource:
    url: jdbc:h2:mem:idptest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

idp:
  jwt:
    secret: unit-test-signing-secret-key-that-is-long-enough-1234567890
    expiration-ms: 3600000
    issuer: owaspcheck-idp

logging:
  level:
    root: WARN
