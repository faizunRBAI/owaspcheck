---
# Application delivery: environment file, image load, systemd-managed container.
# Uses only ansible.builtin modules - ansible-core ships no community.docker.
#
# REGISTRY-FREE DELIVERY: the image is built in CI and shipped to this host as
# a gzipped tarball (scp'd to {{ image_archive }} by the configure stage), then
# loaded with `docker load`. The host never authenticates to a registry, so the
# GHCR organization-package permission is irrelevant here.
#
# Every command task declares changed_when explicitly: the load reports change
# only when it actually imported a new layer set, and prune is a read-mostly
# probe. This keeps reruns honest and idempotent.
#
# MODULE CHOICE: ansible.builtin.systemd (NOT systemd_service). The latter is
# the newer name and only exists from ansible-core 2.17; `systemd` is the
# long-standing name that resolves on every version. Since the configure stage
# installs ansible-core from pip at runtime, pinning behaviour to a module that
# may not exist would fail at PARSE time - ansible resolves every module before
# the first task runs, so the whole play would die with
# "couldn't resolve module/action", not a single skipped task.

- name: Ensure the application config directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}/config"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Write the runtime environment file
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_dir }}/config/app.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: env_file

- name: Confirm the image archive arrived on the host
  ansible.builtin.stat:
    path: "{{ image_archive }}"
  register: image_archive_stat

- name: Fail early when the image archive is missing
  ansible.builtin.fail:
    msg: >-
      Image archive {{ image_archive }} was not found on the host. The
      configure stage must scp it before running this playbook.
  when: not image_archive_stat.stat.exists

# `docker load` is idempotent in effect: re-loading an image that is already
# present re-uses the existing layers and prints "Loaded image" without
# changing anything meaningful. The changed_when below reports a real import
# only when at least one layer was actually added.
- name: Load the application image from the archive
  ansible.builtin.command:
    argv:
      - docker
      - load
      - --input
      - "{{ image_archive }}"
  register: docker_load
  changed_when: "'Loaded image' in docker_load.stdout"
  failed_when: docker_load.rc != 0

- name: Confirm the expected image tag is now present
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - "{{ image_ref }}"
  register: image_inspect
  changed_when: false
  failed_when: image_inspect.rc != 0

- name: Install the systemd unit for the portal container
  ansible.builtin.template:
    src: idp-portal.service.j2
    dest: /etc/systemd/system/{{ container_name }}.service
    owner: root
    group: root
    mode: "0644"
  register: unit_file

- name: Reload systemd so the unit definition is current
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable the portal service at boot
  ansible.builtin.systemd:
    name: "{{ container_name }}"
    enabled: true

# Always restart on a deploy: the image tag is pinned to the commit SHA, so a
# new image or a changed environment file must take effect immediately.
- name: Restart the portal service to apply the current image and configuration
  ansible.builtin.systemd:
    name: "{{ container_name }}"
    state: restarted

- name: Wait for the application to answer on its container port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ app_port }}"
    delay: 5
    timeout: 180

- name: Remove the image archive now that it has been loaded
  ansible.builtin.file:
    path: "{{ image_archive }}"
    state: absent

- name: Remove dangling images left by previous deployments
  ansible.builtin.command:
    argv:
      - docker
      - image
      - prune
      - --force
      - --filter
      - dangling=true
  register: prune
  changed_when: "'Total reclaimed space: 0B' not in prune.stdout"
  failed_when: prune.rc != 0
